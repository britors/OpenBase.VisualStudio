<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/loader.js"></script>
    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        let editor;
        require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs' } });

        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('container'), {
                value: '-- SQL Query\nSELECT * FROM table;',
                language: 'sql',
                theme: 'vs-dark',
                automaticLayout: true
            });
        });

        window.getEditorValue = function() {
            return editor ? editor.getValue() : '';
        };

        window.setEditorValue = function(value) {
            if (editor) editor.setValue(value);
        };

        window.setTheme = function(themeName) {
            monaco.editor.setTheme(themeName === 'dark' ? 'vs-dark' : 'vs');
        };

        window.chrome.webview.addEventListener('message', event => {
            const data = event.data;
            if (data.type === 'setTheme') {
                window.setTheme(data.theme);
            } else if (data.type === 'setValue') {
                window.setEditorValue(data.value);
            }
        });
    </script>
</body>
</html>
