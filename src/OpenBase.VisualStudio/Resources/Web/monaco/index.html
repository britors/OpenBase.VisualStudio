<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        // Mock do Monaco Editor para validação da Phase 3
        const container = document.getElementById('container');
        container.innerHTML = '<textarea id="editor" style="width:100%; height:100%; background:#1e1e1e; color:#d4d4d4; border:none; padding:10px; font-family:Consolas, monospace; outline:none;" placeholder="SELECT * FROM ..."></textarea>';
        
        const editor = document.getElementById('editor');

        window.getEditorValue = function() {
            return editor.value;
        };

        window.setEditorValue = function(value) {
            editor.value = value;
        };

        window.addEventListener('message', event => {
            if (event.data.type === 'setValue') {
                window.setEditorValue(event.data.value);
            }
        });
    </script>
</body>
</html>
